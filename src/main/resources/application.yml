spring:
  application:
    name: gridgate
  datasource:
    url: jdbc:h2:file:./data/gridgate
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080

gridgate:
  dry-run-default: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,shutdown
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: when_authorized

calle:
  api-key: ${CALLE_API_KEY:}
  base-url: ${CALLE_BASE_URL:https://api.heycall-e.com}
  webhook-public-url: ${GRIDGATE_WEBHOOK_URL:}
  webhook-secret: ${CALLE_WEBHOOK_SECRET:}
